name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Generated files must match what the code produces, so they cannot drift.
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --locked
      - run: cd frontend && npm ci
      - run: make types sample-data
      - name: Generated types and sample data are up to date
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts sample_data

  # The phone app re-implements the API in TypeScript. `make mobile-test` records what the Python API
  # answers on the sample data (goldens are regenerated, never committed), checks the TypeScript
  # types and replays every answer against the TypeScript engine.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: cd backend && uv sync --locked
      - run: cd mobile && npm ci
      - run: make mobile-test
      - run: make mobile-build
      - name: The build holds the synthetic demo pack and no other data pack
        run: |
          test -f mobile/dist/demo.cx5pack
          test -z "$(find mobile/dist -name '*.cx5pack' ! -name demo.cx5pack)"

  # Nothing private may be published: no databases, raw exports or data packs in git (see `make audit`).
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: cd backend && uv sync --locked
      - run: make audit
