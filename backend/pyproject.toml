[project]
name = "mazda-dash"
version = "0.1.0"
description = "Analysis and dashboard for Mazda CX-5 telemetry exports"
authors = [
    { name = "Antonio Castro", email = "antonio.castro@masdima.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
