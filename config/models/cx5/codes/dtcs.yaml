# Diagnostic trouble codes, keyed by the code WITHOUT the failure-type byte
# (e.g. "U0198" for "U0198:00"). Same fields as warnings.yaml.
# Letter = system (P powertrain, C chassis, B body, U network). A second character 0
# means an SAE-standard code; anything else is Mazda-specific and not public.
"U0198":
  title: Lost communication with telematics control module
  severity: unknown
  notes: SAE J2012 definition.
"U3000":
  title: Control module (internal fault)
  severity: unknown
  notes: SAE J2012 definition.
