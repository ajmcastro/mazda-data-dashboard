# ECU abbreviations from `ECU_NAME_MKT`. Titles marked "(inferred)" are guesses from the
# abbreviation; correct them if you know better. null = unknown.
BCM: {title: Body control module}
DCM: {title: Data communication module (telematics)}
DSC: {title: Dynamic stability control}
EPS: {title: Electric power steering}
ECM: {title: Engine control module}
IC: {title: Instrument cluster}
CGW: {title: Central gateway}
ADU: {title: i-ACTIVSENSE domain unit (ADAS domain unit)}
ALH: {title: Adaptive LED headlights control module}
CDC: {title: Cockpit domain controller}
DASH_ESU: {title: Dash-electrical supply unit}
DOOR_ESU_D: {title: Door-electrical supply unit (driver side)}
DOOR_ESU_P: {title: Door-electrical supply unit (passenger side)}
ESU: {title: Electrical supply unit}
FR: {title: Front radar sensor}
FSRL: {title: Front side radar sensor (LH)}
FSRR: {title: Front side radar sensor (RH)}
ISPU: {title: Integrated sound processing unit}
LCM_L: {title: Light control module (LH)}
LCM_R: {title: Light control module (RH)}
LFU: {title: LF control unit (keyless/immobilizer low-frequency transmitter)}
PLG: {title: Power liftgate control module}
RSRL: {title: Rear side radar sensor (LH)}
RSRR: {title: Rear side radar sensor (RH)}
SAS_CM: {title: SAS control module (air bag system)} # Mazda: SAS = Sophisticated Air bag Sensor
WC_Qi: {title: Wireless charger (Qi)}
