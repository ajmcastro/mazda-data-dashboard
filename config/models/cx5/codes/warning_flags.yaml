# Meanings of the car's warning-lamp bit flags (128 of them: `vdt_2_warningpt_*` power train and
# `vdt_7_warningbody_*` body). Mazda does not publish them, so this file starts empty: never guess.
# Only the flags that ever change are shown in the dashboard (Status > Warning lamps); the page lists
# what happened around each one to help you work out what it is.
#
# Key = the flag's name as shown in the dashboard. Fields: title, severity (info | warning | critical),
# category, notes. Run `make model` after editing. A made-up example of the format (NOT what this flag
# means):
#
# vdt_7_warningbody_1_30:
#   title: Example lamp
#   severity: info
#   notes: where you found out, and how sure you are

# Notes below are co-occurrences found in this car's exports (Jun–Nov 2026), not meanings: titles stay null.
vdt_7_warningbody_2_44:
  title: null
  notes: >-
    Hint only. Came on 3 times (1 Aug, 12 Oct, 29 Oct 2026); each time warning $1B4 was reported
    between the previous status report and the one showing the flag on, and $1B4 was seen on no other days.
vdt_2_warningpt_1_23:
  title: null
  notes: >-
    Hint only. Always switches on and off together with vdt_2_warningpt_2_46 (6 identical episodes);
    first on 15 Oct 2026, the day of the diagnostic report. The rare warnings $049, $072, $086 and $0B5
    appeared once (22 Oct) just before one of its episodes.
vdt_2_warningpt_2_46:
  title: null
  notes: >-
    Hint only. Always switches on and off together with vdt_2_warningpt_1_23 (6 identical episodes);
    first on 15 Oct 2026, the day of the diagnostic report.
vdt_7_warningbody_1_30:
  title: null
  notes: >-
    Hint only. Switches on and off about 58 times, apparently with normal use; no particular warning
    code or fault goes with it.
