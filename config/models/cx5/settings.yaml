# Settings of your car and of the dashboard (the code descriptions are in config/codes/).
# Edit, then run `make model` (or `make ingest`) to apply them; `make timezone` checks the time zone
# against your data.

# The time zone of the clock the car uses for "when were the tire pressures measured". It is the car's
# LOCAL time (not UTC), so it needs a zone to be turned into UTC. Use an IANA name such as
# Europe/Lisbon, Europe/Berlin, America/New_York. Wrong zone = wrong measurement times (a measurement
# that appears to be in the future, or hours old). The demo data uses Europe/Lisbon.
car_timezone: Europe/Lisbon

# A tire reading counts as stale when the car still showed a measurement older than this many hours.
tire_stale_hours: 6

# Optional: an estimated fuel cost (cost per 100 km on Trends, Compare and the Overview). It is an estimate:
# the litres the car reports for each trip times the price you enter, NOT what you paid. Remove the # to use it,
# then run `make model`. One entry per date, oldest first; a single price: `fuel_price_per_l: 1.75`.
fuel_currency: EUR
fuel_prices:
   - {from: 2026-06-01, per_l: 1.907}
   - {from: 2026-07-01, per_l: 1.920}
   - {from: 2026-08-01, per_l: 1.958}
   - {from: 2026-09-01, per_l: 2.079}
   - {from: 2026-10-01, per_l: 2.094}
   - {from: 2026-11-01, per_l: 1.922}
   - {from: 2026-11-18, per_l: 1.859}
   - {from: 2026-11-24, per_l: 1.829}

# Optional: fill-ups (the "Fill-ups" panel on Status). The car reports the fuel level in % only, so litres
# need the size of the fuel tank (see the owner's manual). Remove the # and set YOUR tank's size, then run
# `make model`. Without it fill-ups are shown in points of the gauge.
tank_litres: 56
# A rise of the fuel level smaller than this many points is listed as doubtful (default 15).
# refuel_min_points: 15
# What you actually paid goes in a file next to this one, fuel_log.yaml (amounts in fuel_currency), e.g.
#   - {date: 2026-06-06, paid: 78.40, litres: 41.1}
# `litres` is optional. A payment is matched to the fill-up nearest its date (up to 3 days away).

# Optional: a yearly distance limit (a lease or warranty year). The Overview's "Looking ahead" then sets the
# distance so far this year and the projection at your recent pace against it. Remove the # and set your own.
# mileage: {limit_km_per_year: 15000, start_date: 2026-03-03}

# Warning episodes (the "Patterns" panel on Warnings): a silence longer than this many minutes between two warnings
# ends an episode (default 10, from 1 to 240).
# warning_episode_minutes: 10
