# Settings of this car (config/models/cx5/settings.yaml has the full explanation).
# Edit, then run `make model MODEL=cx60`; `make timezone MODEL=cx60` checks the zone against your data.

# The time zone of the clock the car uses for "when were the tire pressures measured": its LOCAL time.
# An IANA name such as Europe/Berlin or America/New_York. The demo data of this model uses Europe/Berlin.
car_timezone: Europe/Berlin

# A tire reading counts as stale when the car still showed a measurement older than this many hours.
tire_stale_hours: 6

# Optional: an estimated fuel cost (cost per 100 km on Trends, Compare and the Overview). It is an estimate:
# the litres the car reports for each trip times the price you enter, NOT what you paid. Remove the # to use it,
# then run `make model`. One entry per date, oldest first; a single price: `fuel_price_per_l: 1.75`.
# fuel_currency: EUR
# fuel_prices:
#   - {from: 2026-03-01, per_l: 1.72}
#   - {from: 2026-05-15, per_l: 1.81}
