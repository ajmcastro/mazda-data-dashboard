<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d0e10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#efebe3" media="(prefers-color-scheme: light)" />
    <script>
      // apply a saved Dark / Light choice before the first paint (see src/theme.ts)
      try {
        var t = localStorage.getItem('cx5.theme')
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <meta name="description" content="A private dashboard for the data your Mazda sends to Mazda: trips, fuel use, tire pressure, warnings, fault codes and alerts, on your own computer." />
    <title>CX-5 Telemetry</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
