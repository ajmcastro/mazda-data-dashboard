<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>M12 spike · DuckDB in the browser</title>
    <style>
      :root { color-scheme: dark light; }
      body { font: 15px/1.45 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; max-width: 820px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p, li { color: #888; }
      button, input[type='file'] { font: inherit; padding: 10px 14px; margin: 4px 6px 4px 0; }
      #verdict { font-size: 18px; font-weight: 700; margin: 14px 0 6px; }
      .ok { color: #2fb67c; } .bad { color: #e5484d; }
      table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0 14px; }
      td, th { text-align: left; padding: 3px 8px 3px 0; border-bottom: 1px solid #8884; vertical-align: top; }
      td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
      #log { white-space: pre-wrap; font: 12px ui-monospace, monospace; color: #888; }
    </style>
  </head>
  <body>
    <h1>M12 spike: DuckDB in the browser</h1>
    <p>Loads a data pack, rebuilds every SQL view, checks the results against the Python database, and times typical queries.</p>
    <div>
      <button id="run-demo">Run with demo pack</button>
      <!-- no accept= filter on purpose: iOS greys out files whose extension it does not know (.cx5pack) -->
      <input id="file" type="file" aria-label="Run with my own pack" />
    </div>
    <p>
      <b>Compare packs</b> (choose several files at once):
      <input id="files" type="file" multiple aria-label="Compare several packs" />
    </p>
    <div id="verdict"></div>
    <div id="summary"></div>
    <div id="log"></div>
    <script type="module" src="/src/spike.ts"></script>
  </body>
</html>
